version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: team-task-manager-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: team-task-manager-api
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/team-task-manager?authSource=admin
      - JWT_SECRET=your_secret_key
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: team-task-manager-ui
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
